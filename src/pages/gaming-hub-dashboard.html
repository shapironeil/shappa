<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Shappa Hub - Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .dashboard-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.5);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* User Profile */
        .user-profile {
            padding: 20px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }

        .user-profile-content {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .user-avatar {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            border: 3px solid #000000;
        }

        .user-avatar-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            border-radius: 50%;
            border: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-level {
            font-size: 13px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level-badge {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(31, 41, 55, 0.8);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6 0%, #3b82f6 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Sidebar Menu */
        .sidebar-menu {
            flex: 1;
            padding: 16px 0;
            overflow-y: auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background: rgba(139, 92, 246, 0.1);
            color: #ffffff;
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.2) 0%, transparent 100%);
            color: #a78bfa;
            border-left-color: #8b5cf6;
            font-weight: 600;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item-icon {
            width: 20px;
            text-align: center;
            font-size: 18px;
        }

        .menu-item-right {
            font-size: 18px;
            opacity: 0.6;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #ffffff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #000000;
        }

        .top-bar {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-bell {
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 20px;
        }

        .notification-bell:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .notification-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 18px;
            height: 18px;
            background: #e53e3e;
            color: white;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #000000;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* Game Gallery */
        .gallery-section {
            margin-bottom: 32px;
        }

        .gallery-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .game-card {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8b5cf6 0%, #3b82f6 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.3);
        }

        .game-card:hover::before {
            transform: scaleX(1);
        }

        .game-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .game-subtitle {
            font-size: 13px;
            color: #9ca3af;
        }

        .game-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .game-status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .game-image {
            width: 100%;
            height: 200px;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            overflow: hidden;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #9ca3af;
        }

        .game-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Featured Game (Large) */
        .featured-game {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.9) 0%, rgba(31, 41, 55, 0.9) 100%);
            border: 2px solid rgba(139, 92, 246, 0.3);
        }

        .featured-game .game-image {
            height: 300px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .featured-game {
                grid-column: span 1;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                z-index: 1000;
                transition: left 0.3s;
            }

            .sidebar.open {
                left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        .content-area::-webkit-scrollbar,
        .sidebar-menu::-webkit-scrollbar {
            width: 8px;
        }

        .content-area::-webkit-scrollbar-track,
        .sidebar-menu::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
        }

        .content-area::-webkit-scrollbar-thumb,
        .sidebar-menu::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }

        .content-area::-webkit-scrollbar-thumb:hover,
        .sidebar-menu::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">🎮</div>
                <h1>GameHub</h1>
            </div>
            
            <!-- User Profile -->
            <div class="user-profile">
                <div class="user-profile-content">
                    <div class="user-avatar" id="userAvatar">
                        <div class="user-avatar-badge" id="userLevelBadge">5</div>
                    </div>
                    <div class="user-info">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-level">
                            <span class="level-badge">Lv. <span id="userLevel">5</span></span>
                        </div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 65%;"></div>
                </div>
            </div>
            
            <!-- Menu -->
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" onclick="showSection('games'); return false;">
                    <div class="menu-item-left">
                        <span class="menu-item-icon">🎮</span>
                        <span>Giochi</span>
                    </div>
                    <span class="menu-item-right">Σ</span>
                </a>
                <a href="#" class="menu-item" onclick="showSection('leaderboard'); return false;">
                    <div class="menu-item-left">
                        <span class="menu-item-icon">🏆</span>
                        <span>Classifica</span>
                    </div>
                </a>
                <a href="#" class="menu-item" onclick="showSection('friends'); return false;">
                    <div class="menu-item-left">
                        <span class="menu-item-icon">👥</span>
                        <span>Amici</span>
                    </div>
                </a>
                <a href="#" class="menu-item" onclick="showSection('settings'); return false;">
                    <div class="menu-item-left">
                        <span class="menu-item-icon">⚙️</span>
                        <span>Impostazioni</span>
                    </div>
                </a>
            </nav>
            
            <!-- Footer -->
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    Esci
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Galleria Giochi</h1>
                <div class="top-actions">
                    <div class="notification-bell">
                        🔔
                        <span class="notification-badge">3</span>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div class="gallery-section">
                    <div class="games-grid" id="gamesGrid">
                        <!-- Popolato dinamicamente -->
                        <div class="loading" style="text-align: center; padding: 48px; color: #9ca3af;">
                            <div style="font-size: 48px; margin-bottom: 16px;">🎮</div>
                            <p>Caricamento giochi...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Auth System -->
    <script src="../core/dataManager.js"></script>
    <script src="../core/userDataSync.js"></script>
    <script src="../utils/auth-v2.js"></script>
    <script>
        // Initialize auth system
        const authSystem = new ShappaAuth();

        // Check if logged in - redirect to login if not
        if (!authSystem.isLoggedIn()) {
            console.log('⚠️ User not logged in, redirecting to login...');
            window.location.href = 'gaming-hub-login.html';
        }

        // Load user info and gaming profile
        const currentUser = authSystem.getCurrentUser();
        if (currentUser) {
            const userName = currentUser.username || 'Player';
            document.getElementById('userName').textContent = userName;
            const initial = userName[0].toUpperCase();
            document.getElementById('userAvatar').textContent = initial;
            
            // Load gaming profile (level, experience, etc.)
            loadGamingProfile(currentUser);
        }

        // Load or initialize gaming profile
        async function loadGamingProfile(user) {
            try {
                // Try to load from server
                const response = await fetch(`/api/gaming/profile/${user.username}`);
                if (response.ok) {
                    const profile = await response.json();
                    if (profile.success && profile.data) {
                        updateGamingUI(profile.data);
                        return;
                    }
                } else if (response.status === 404) {
                    // Profile doesn't exist yet, initialize it
                    console.log('No gaming profile found, initializing...');
                }
            } catch (error) {
                console.log('Error loading gaming profile, initializing...', error);
            }
            
            // Initialize new profile with level 1
            const newProfile = {
                level: 1,
                experience: 0,
                experienceToNext: 100,
                totalGames: 0,
                wins: 0,
                losses: 0
            };
            
            // Save to server
            try {
                const saveResponse = await fetch(`/api/gaming/profile/${user.username}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProfile)
                });
                if (saveResponse.ok) {
                    console.log('✅ Gaming profile initialized');
                }
            } catch (error) {
                console.error('Error saving gaming profile:', error);
            }
            
            updateGamingUI(newProfile);
        }

        function updateGamingUI(profile) {
            const level = profile.level || 1;
            const experience = profile.experience || 0;
            const experienceToNext = profile.experienceToNext || 100;
            const progress = (experience / experienceToNext) * 100;
            
            const levelEl = document.getElementById('userLevel');
            const badgeEl = document.getElementById('userLevelBadge');
            const progressEl = document.getElementById('progressFill');
            
            if (levelEl) levelEl.textContent = level;
            if (badgeEl) badgeEl.textContent = level;
            if (progressEl) progressEl.style.width = `${Math.min(progress, 100)}%`;
        }

        // Logout
        function handleLogout() {
            if (authSystem) {
                authSystem.logout();
            }
            window.location.href = 'gaming-hub-login.html';
        }

        // Section navigation
        function showSection(section) {
            // Rimuovi active da tutti i menu items
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            // Aggiungi active al menu item cliccato
            event.target.closest('.menu-item').classList.add('active');
            
            console.log('Show section:', section);
            // TODO: Implementare logica per mostrare sezioni diverse
        }

        // Games data (global)
        let games = [];
        
        // Load games
        function loadGames() {
            const container = document.getElementById('gamesGrid');
            
            // Mock games data
            games = [
                {
                    id: 'fightin-simulation',
                    title: 'FightinSimulation',
                    subtitle: '3D Fighting Game',
                    status: 'Online',
                    image: '🥊',
                    stats: { players: '1.5K', rating: '4.9' },
                    path: '../games/fightin-simulation/index.html'
                },
                {
                    id: 1,
                    title: 'FINAL FIGHT®',
                    subtitle: 'SNS-FT-USA',
                    status: 'Online',
                    image: '🎮',
                    stats: { players: '2.5K', rating: '4.8' }
                },
                {
                    id: 2,
                    title: 'Racing Championship',
                    subtitle: 'Arcade Racing',
                    status: 'Online',
                    image: '🏎️',
                    stats: { players: '1.2K', rating: '4.6' }
                },
                {
                    id: 3,
                    title: 'Pixel Adventure',
                    subtitle: 'Retro Platform',
                    status: 'Online',
                    image: '👾',
                    stats: { players: '890', rating: '4.9' }
                },
                {
                    id: 4,
                    title: 'Space Invaders',
                    subtitle: 'Classic Arcade',
                    status: 'Offline',
                    image: '👽',
                    stats: { players: '650', rating: '4.7' }
                },
                {
                    id: 5,
                    title: 'Street Fighter',
                    subtitle: 'Fighting Game',
                    status: 'Online',
                    image: '👊',
                    stats: { players: '3.1K', rating: '4.8' }
                },
                {
                    id: 6,
                    title: 'Puzzle Quest',
                    subtitle: 'Brain Teaser',
                    status: 'Online',
                    image: '🧩',
                    stats: { players: '980', rating: '4.5' }
                }
            ];

            container.innerHTML = games.map((game, index) => {
                const isFeatured = index === 0;
                const statusClass = game.status === 'Online' ? 'game-status' : 'game-status';
                const statusColor = game.status === 'Online' ? '#10b981' : '#6b7280';
                
                // Escape game.id for onclick (handle strings properly)
                const gameIdEscaped = typeof game.id === 'string' ? `'${game.id}'` : game.id;
                
                return `
                    <div class="game-card ${isFeatured ? 'featured-game' : ''}" onclick="openGame(${gameIdEscaped})">
                        <div class="game-card-header">
                            <div>
                                <div class="game-title">${game.title}</div>
                                <div class="game-subtitle">${game.subtitle}</div>
                            </div>
                            <div class="game-status" style="color: ${statusColor}; background: rgba(${game.status === 'Online' ? '16, 185, 129' : '107, 114, 128'}, 0.1);">
                                <span class="game-status-dot" style="background: ${statusColor};"></span>
                                ${game.status}
                            </div>
                        </div>
                        <div class="game-image">
                            ${game.image}
                        </div>
                        <div class="game-stats">
                            <div class="game-stat">👥 ${game.stats.players}</div>
                            <div class="game-stat">⭐ ${game.stats.rating}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openGame(gameId) {
            console.log('Opening game:', gameId, 'Available games:', games);
            
            // Find game in games array
            const game = games.find(g => {
                const gameIdStr = String(g.id);
                const searchIdStr = String(gameId);
                return gameIdStr === searchIdStr;
            });
            
            if (game && game.path) {
                // Open game in same window
                window.location.href = game.path;
            } else {
                console.error('Game not found or path not available:', gameId, 'Available:', games.map(g => g.id));
            }
        }
        
        // Make openGame globally available
        window.openGame = openGame;

        // Load games on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadGames();
        });
    </script>
</body>
</html>

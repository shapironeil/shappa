<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Hub - Listings Attivi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1e;
            color: #ffffff;
            min-height: 100vh;
        }
        
        .container {
            padding: 32px;
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 32px;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 8px;
            color: #4ade80;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(34, 197, 94, 0.2);
            transform: translateX(-4px);
        }
        
        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .description {
            color: #9ca3af;
            font-size: 16px;
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #9ca3af;
        }
        
        .listings-table {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: rgba(31, 41, 55, 0.6);
        }
        
        th {
            padding: 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        td {
            padding: 16px;
            border-top: 1px solid rgba(34, 197, 94, 0.1);
        }
        
        tbody tr {
            transition: all 0.2s;
        }
        
        tbody tr:hover {
            background: rgba(34, 197, 94, 0.05);
        }
        
        .listing-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(31, 41, 55, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .listing-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .listing-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .listing-sku {
            font-size: 12px;
            color: #6b7280;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        
        .status-paused {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        
        .status-outofstock {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        
        .price {
            font-weight: 600;
            color: #22c55e;
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 6px;
            background: rgba(31, 41, 55, 0.6);
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-icon:hover {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.4);
            color: #4ade80;
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: #9ca3af;
        }
        
        .empty-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }
        
        .empty-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #d1d5db;
        }
        
        .empty-description {
            font-size: 16px;
            margin-bottom: 24px;
        }
        
        .btn-add {
            padding: 14px 32px;
            background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="arbitrage-hub-dashboard.html" class="back-btn">
                <span>←</span>
                <span>Torna alla Dashboard</span>
            </a>
            <h1>📦 Listings Attivi</h1>
            <p class="description">Monitora e gestisci tutti i tuoi listing pubblicati</p>
        </div>
        
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalActive">0</div>
                <div class="stat-label">Listing Attivi</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalRevenue">€0</div>
                <div class="stat-label">Revenue Totale</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgROI">0%</div>
                <div class="stat-label">ROI Medio</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSold">0</div>
                <div class="stat-label">Prodotti Venduti</div>
            </div>
        </div>
        
        <div class="listings-table" id="listingsContainer">
            <div class="empty-state">
                <div class="empty-icon">📦</div>
                <div class="empty-title">Nessun listing attivo</div>
                <div class="empty-description">Pubblica il tuo primo listing dal workshop</div>
                <button class="btn-add" onclick="window.location.href='arbitrage-workshop.html'">
                    Vai al Workshop
                </button>
            </div>
        </div>
    </div>
    
    <script src="../core/dataManager.js"></script>
    <script src="../core/userDataSync.js"></script>
    <script src="../utils/auth-v2.js"></script>
    <script src="../js/arbitrage-config.js"></script>
    <script src="../js/arbitrage-core.js"></script>
    <script>
        const authSystem = new ShappaAuth();
        const arbitrageCore = window.ArbitrageCore;
        
        if (!authSystem.isLoggedIn()) {
            window.location.href = 'arbitrage-hub-login.html';
        }
        
        async function loadListings() {
            const result = await arbitrageCore.getListings();
            const container = document.getElementById('listingsContainer');
            
            if (!result.success || result.listings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <div class="empty-title">Nessun listing attivo</div>
                        <div class="empty-description">Pubblica il tuo primo listing dal workshop</div>
                        <button class="btn-add" onclick="window.location.href='arbitrage-workshop.html'">
                            Vai al Workshop
                        </button>
                    </div>
                `;
                updateStats({ totalActive: 0, totalRevenue: 0, avgROI: 0, totalSold: 0 });
                return;
            }
            
            // Calculate stats
            const stats = {
                totalActive: result.listings.filter(l => l.status === 'active').length,
                totalRevenue: result.listings.reduce((sum, l) => sum + (l.revenue || 0), 0),
                avgROI: result.listings.length > 0 
                    ? result.listings.reduce((sum, l) => sum + (l.roi || 0), 0) / result.listings.length 
                    : 0,
                totalSold: result.listings.reduce((sum, l) => sum + (l.sold || 0), 0)
            };
            
            updateStats(stats);
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Prodotto</th>
                            <th>SKU</th>
                            <th>Status</th>
                            <th>Prezzo</th>
                            <th>Stock</th>
                            <th>Venduti</th>
                            <th>ROI</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${result.listings.map(listing => `
                            <tr>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <div class="listing-image">
                                            ${listing.image ? `<img src="${listing.image}" alt="${listing.title}">` : '📦'}
                                        </div>
                                        <div>
                                            <div class="listing-title">${listing.title || 'N/A'}</div>
                                            <div class="listing-sku">${listing.marketplace || 'N/A'}</div>
                                        </div>
                                    </div>
                                </td>
                                <td><code>${listing.sku || 'N/A'}</code></td>
                                <td>
                                    <span class="status-badge status-${listing.status || 'active'}">
                                        ${listing.status || 'Active'}
                                    </span>
                                </td>
                                <td class="price">€${(listing.price || 0).toFixed(2)}</td>
                                <td>${listing.stock || 0}</td>
                                <td>${listing.sold || 0}</td>
                                <td>${(listing.roi || 0).toFixed(1)}%</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-icon" onclick="editListing('${listing.id}')" title="Modifica">
                                            ✏️
                                        </button>
                                        <button class="btn-icon" onclick="pauseListing('${listing.id}')" title="Pausa">
                                            ⏸️
                                        </button>
                                        <button class="btn-icon" onclick="deleteListing('${listing.id}')" title="Elimina">
                                            🗑️
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function updateStats(stats) {
            document.getElementById('totalActive').textContent = stats.totalActive;
            document.getElementById('totalRevenue').textContent = `€${stats.totalRevenue.toFixed(2)}`;
            document.getElementById('avgROI').textContent = `${stats.avgROI.toFixed(1)}%`;
            document.getElementById('totalSold').textContent = stats.totalSold;
        }
        
        function editListing(listingId) {
            alert('Modifica listing - Coming soon!');
        }
        
        async function pauseListing(listingId) {
            if (confirm('Mettere in pausa questo listing?')) {
                await arbitrageCore.updateListing(listingId, { status: 'paused' });
                loadListings();
            }
        }
        
        async function deleteListing(listingId) {
            if (confirm('Eliminare definitivamente questo listing?')) {
                await arbitrageCore.deleteListing(listingId);
                loadListings();
            }
        }
        
        loadListings();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shappa - Debug Utenti</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background: #f8fafc;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .users-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        }
        .user-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #10b981;
        }
        .user-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
        }
        .user-email {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .user-details {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .detail-label {
            font-weight: 500;
            color: #374151;
        }
        .detail-value {
            color: #6b7280;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .connections {
            margin-top: 1rem;
        }
        .connection-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        .connected {
            background: #d1fae5;
            color: #065f46;
        }
        .disconnected {
            background: #fee2e2;
            color: #991b1b;
        }
        .actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #1f2937;
        }
        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Shappa - Debug Utenti Registrati</h1>
        <p>Visualizzazione e gestione degli utenti nel database locale</p>
    </div>

    <div class="stats" id="stats"></div>
    
    <div class="users-grid" id="usersGrid"></div>

    <script src="../utils/auth.js"></script>
    <script>
        console.log('🔍 Debug page loaded');
        
        // Inizializza il database
        AuthManager.initDatabase();
        
        // Carica e mostra gli utenti
        function loadUsers() {
            const users = AuthManager.getUsers();
            const currentUser = AuthManager.getCurrentUser();
            
            // Mostra statistiche
            showStats(users, currentUser);
            
            // Mostra utenti
            showUsers(users, currentUser);
        }
        
        function showStats(users, currentUser) {
            const statsContainer = document.getElementById('stats');
            
            const totalUsers = users.length;
            const connectedEbay = users.filter(u => u.profile?.ebayConnected).length;
            const connectedAmazon = users.filter(u => u.profile?.amazonConnected).length;
            const totalListings = users.reduce((sum, u) => sum + (u.profile?.totalListings || 0), 0);
            
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalUsers}</div>
                    <div class="stat-label">👥 Utenti Totali</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${connectedEbay}</div>
                    <div class="stat-label">🛒 eBay Connessi</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${connectedAmazon}</div>
                    <div class="stat-label">📦 Amazon Connessi</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalListings}</div>
                    <div class="stat-label">📋 Listing Totali</div>
                </div>
            `;
        }
        
        function showUsers(users, currentUser) {
            const container = document.getElementById('usersGrid');
            
            if (users.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 Nessun utente registrato</h3>
                        <p>Vai alla <a href="register.html">pagina di registrazione</a> per creare il primo utente</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = users.map(user => {
                const isCurrentUser = currentUser && currentUser.id === user.id;
                const initials = user.username.substring(0, 2).toUpperCase();
                
                return `
                    <div class="user-card ${isCurrentUser ? 'current-user' : ''}" style="${isCurrentUser ? 'border-left-color: #f59e0b;' : ''}">
                        <div class="user-header">
                            <div class="user-avatar">${initials}</div>
                            <div class="user-info">
                                <div class="user-name">
                                    ${user.username}
                                    ${isCurrentUser ? '👑' : ''}
                                </div>
                                <div class="user-email">${user.email}</div>
                            </div>
                        </div>
                        
                        <div class="connections">
                            <span class="connection-status ${user.profile?.ebayConnected ? 'connected' : 'disconnected'}">
                                ${user.profile?.ebayConnected ? '✅' : '❌'} eBay
                            </span>
                            <span class="connection-status ${user.profile?.amazonConnected ? 'connected' : 'disconnected'}">
                                ${user.profile?.amazonConnected ? '✅' : '❌'} Amazon
                            </span>
                        </div>
                        
                        <div class="user-details">
                            <div class="detail-row">
                                <span class="detail-label">ID Utente:</span>
                                <span class="detail-value">${user.id}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Registrato:</span>
                                <span class="detail-value">${new Date(user.createdAt).toLocaleString('it-IT')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Listing Totali:</span>
                                <span class="detail-value">${user.profile?.totalListings || 0}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Vendite Totali:</span>
                                <span class="detail-value">${user.profile?.totalSales || 0}</span>
                            </div>
                        </div>
                        
                        <div class="actions">
                            ${!isCurrentUser ? `<button class="btn btn-primary" onclick="loginAs('${user.id}')">🔐 Login come ${user.username}</button>` : ''}
                            <button class="btn btn-danger" onclick="deleteUser('${user.id}')">🗑️ Elimina</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Login come altro utente
        function loginAs(userId) {
            const users = AuthManager.getUsers();
            const user = users.find(u => u.id === userId);
            
            if (user && confirm(`Effettuare login come ${user.username}?`)) {
                localStorage.setItem('shappa_current_user', JSON.stringify(user));
                alert(`✅ Login effettuato come ${user.username}`);
                loadUsers(); // Ricarica la vista
            }
        }
        
        // Elimina utente
        function deleteUser(userId) {
            const users = AuthManager.getUsers();
            const user = users.find(u => u.id === userId);
            
            if (user && confirm(`Sei sicuro di voler eliminare l'utente ${user.username}?`)) {
                const updatedUsers = users.filter(u => u.id !== userId);
                AuthManager.saveUsers(updatedUsers);
                
                // Se era l'utente corrente, fai logout
                const currentUser = AuthManager.getCurrentUser();
                if (currentUser && currentUser.id === userId) {
                    localStorage.removeItem('shappa_current_user');
                }
                
                alert(`🗑️ Utente ${user.username} eliminato`);
                loadUsers(); // Ricarica la vista
            }
        }
        
        // Carica utenti all'avvio
        document.addEventListener('DOMContentLoaded', loadUsers);
        
        // Auto-refresh ogni 5 secondi
        setInterval(loadUsers, 5000);
        
        console.log('👥 Debug users page ready');
    </script>
</body>
</html>

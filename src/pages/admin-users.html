<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestione Utenti</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/venus.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg">
    <style>
        body {
            font-family: var(--venus-font-family);
            background: #fafbfc;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .venus-dashboard-layout {
            display: flex;
            height: 100vh;
            background: #fafbfc;
        }

        /* Sidebar */
        .venus-sidebar {
            width: 240px;
            background: var(--venus-bg-card);
            border-right: 1px solid var(--venus-border);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .venus-sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--venus-border);
        }

        .venus-logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--venus-text-primary);
            letter-spacing: 0.5px;
        }

        .venus-sidebar-menu {
            flex: 1;
            padding: 8px 0;
            overflow-y: auto;
        }

        .venus-menu-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            margin: 2px 8px;
            border-radius: 6px;
            color: var(--venus-text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--venus-transition);
        }

        .venus-menu-item:hover {
            background: var(--venus-bg-gray);
            color: var(--venus-text-primary);
        }

        .venus-menu-item.venus-active {
            background: var(--venus-primary);
            color: var(--venus-text-white);
        }

        .venus-sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--venus-border);
        }

        .venus-user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px;
        }

        .venus-user-avatar {
            width: 32px;
            height: 32px;
            background: var(--venus-gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--venus-text-white);
            font-weight: 600;
            font-size: 14px;
        }

        .venus-user-info {
            flex: 1;
            min-width: 0;
        }

        .venus-user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--venus-text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .venus-user-role {
            font-size: 11px;
            color: var(--venus-text-muted);
        }

        .venus-logout-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid var(--venus-border);
            border-radius: 6px;
            color: var(--venus-text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--venus-transition);
        }

        .venus-logout-btn:hover {
            background: var(--venus-danger-light);
            border-color: var(--venus-danger);
            color: var(--venus-danger);
        }

        /* Main Content */
        .venus-main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .venus-main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--venus-space-xl) var(--venus-space-2xl);
            background: var(--venus-bg-card);
            border-bottom: 1px solid var(--venus-border);
        }

        .venus-page-title {
            font-size: var(--venus-font-size-2xl);
            font-weight: var(--venus-font-weight-bold);
            color: var(--venus-text-primary);
            margin: 0;
        }

        .venus-content-area {
            flex: 1;
            overflow-y: auto;
            padding: var(--venus-space-xl);
        }

        /* Users Grid */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .user-card {
            background: var(--venus-bg-card);
            border: 1px solid var(--venus-border);
            border-radius: var(--venus-radius);
            padding: 1.5rem;
            cursor: pointer;
            transition: all var(--venus-transition);
        }

        .user-card:hover {
            box-shadow: var(--venus-shadow-md);
            transform: translateY(-2px);
            border-color: var(--venus-primary);
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--venus-border);
        }

        .user-info h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--venus-text-primary);
            margin: 0 0 0.25rem 0;
        }

        .user-id {
            font-size: 0.75rem;
            color: var(--venus-text-muted);
            font-family: var(--venus-font-mono);
        }

        .user-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .summary-item {
            padding: 0.75rem;
            background: var(--venus-bg-gray);
            border-radius: 6px;
        }

        .summary-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--venus-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .summary-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--venus-text-primary);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--venus-text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--venus-border);
            border-top-color: var(--venus-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--venus-text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="venus-dashboard-layout">
        <!-- Sidebar -->
        <aside class="venus-sidebar">
            <div class="venus-sidebar-header">
                <div class="venus-logo">
                    <span class="venus-logo-text">SHAPPA</span>
                </div>
            </div>
            
            <nav class="venus-sidebar-menu">
                <a href="dashboard.html" class="venus-menu-item">
                    Dashboard
                </a>
                <a href="admin-users.html" class="venus-menu-item venus-active">
                    👥 Utenti
                </a>
                <a href="admin-server.html" class="venus-menu-item">
                    Server
                </a>
                <a href="settings.html" class="venus-menu-item">
                    Impostazioni
                </a>
            </nav>
            
            <div class="venus-sidebar-footer">
                <div class="venus-user-profile">
                    <div class="venus-user-avatar" id="userAvatar">A</div>
                    <div class="venus-user-info">
                        <div class="venus-user-name" id="userName">Admin</div>
                        <div class="venus-user-role">Administrator</div>
                    </div>
                </div>
                <button class="venus-logout-btn" id="logoutBtn">
                    Log Out
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="venus-main-content">
            <div class="venus-main-header">
                <h1 class="venus-page-title">👥 Gestione Utenti</h1>
            </div>

            <div class="venus-content-area">
                <div id="usersContainer" class="loading">
                    <div class="loading-spinner"></div>
                    <p>Caricamento utenti...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../utils/auth-v2.js"></script>
    <script>
        // Auth check
        if (!AuthManager.isLoggedIn()) {
            window.location.href = '/src/pages/login.html';
        }

        // Load user info
        const user = AuthManager.getCurrentUser();
        if (user) {
            const userName = user.username || user.email || 'Admin';
            document.getElementById('userName').textContent = userName;
            const initial = userName[0].toUpperCase();
            document.getElementById('userAvatar').textContent = initial;
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            AuthManager.logout();
            window.location.href = '/src/pages/login.html';
        });

        // Load users
        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            
            try {
                // Get all users from server
                const response = await fetch('/api/admin/server-data');
                const serverData = await response.json();
                
                if (!serverData.success || !serverData.data || !serverData.data.users) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👤</div>
                            <strong>Nessun utente trovato</strong>
                            <p>Il server non ha utenti registrati</p>
                        </div>
                    `;
                    return;
                }

                const users = serverData.data.users;
                const userIds = Object.keys(users).map(filename => filename.replace('.json', ''));

                if (userIds.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👤</div>
                            <strong>Nessun utente trovato</strong>
                            <p>Il server non ha utenti registrati</p>
                        </div>
                    `;
                    return;
                }

                // Load full data for each user
                container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Caricamento dati utenti...</p></div>';
                
                const usersWithData = [];
                for (const userId of userIds) {
                    try {
                        const userResponse = await fetch(`/api/admin/user-data/${userId}`);
                        const userData = await userResponse.json();
                        
                        if (userData.success) {
                            usersWithData.push({
                                userId,
                                ...userData.data
                            });
                        } else {
                            usersWithData.push({
                                userId,
                                account: users[`${userId}.json`] || {}
                            });
                        }
                    } catch (error) {
                        console.error(`Error loading data for ${userId}:`, error);
                        usersWithData.push({
                            userId,
                            account: users[`${userId}.json`] || {}
                        });
                    }
                }

                // Render users
                renderUsers(usersWithData);
                
            } catch (error) {
                console.error('Error loading users:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <strong>Errore nel caricamento</strong>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('usersContainer');
            
            if (users.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👤</div>
                        <strong>Nessun utente trovato</strong>
                    </div>
                `;
                return;
            }

            container.innerHTML = '<div class="users-grid">' + 
                users.map(user => {
                    const username = user.account?.username || user.userId;
                    const email = user.account?.email || 'N/A';
                    const createdAt = user.account?.createdAt ? new Date(user.account.createdAt).toLocaleDateString('it-IT') : 'N/A';
                    
                    // Summary stats
                    const interestsCount = user.interests?.length || 0;
                    const sportConfigured = user.sport?.profile ? '✅' : '❌';
                    const webhookConfigured = user.webhook ? '✅' : '❌';
                    const dietConfigured = user.diet?.selectedDiet ? '✅' : '❌';
                    const weight = user.sport?.weight || user.diet?.currentWeight || 'N/A';
                    const goal = user.sport?.goal || 'N/A';
                    
                    return `
                        <div class="user-card" onclick="viewUserProfile('${user.userId}')">
                            <div class="user-header">
                                <div class="user-info">
                                    <h3>${username}</h3>
                                    <span class="user-id">${user.userId}</span>
                                </div>
                            </div>
                            
                            <div class="user-summary">
                                <div class="summary-item">
                                    <div class="summary-label">Email</div>
                                    <div class="summary-value">${email}</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-label">Registrato</div>
                                    <div class="summary-value">${createdAt}</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-label">Interessi</div>
                                    <div class="summary-value">${interestsCount}</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-label">Sport</div>
                                    <div class="summary-value">${sportConfigured}</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-label">Webhook</div>
                                    <div class="summary-value">${webhookConfigured}</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-label">Dieta</div>
                                    <div class="summary-value">${dietConfigured}</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-label">Peso</div>
                                    <div class="summary-value">${weight}${typeof weight === 'number' ? ' kg' : ''}</div>
                                </div>
                                <div class="summary-item">
                                    <div class="summary-label">Obiettivo</div>
                                    <div class="summary-value">${goal}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('') + '</div>';
        }

        function viewUserProfile(userId) {
            window.location.href = `user-profile.html?userId=${userId}`;
        }

        // Load users on page load
        loadUsers();
    </script>
</body>
</html>

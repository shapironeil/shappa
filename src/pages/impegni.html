<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shappa - Hubs</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/venus.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        body {
            font-family: var(--venus-font-family);
            background: #fafbfc;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .venus-dashboard-layout {
            display: flex;
            height: 100vh;
            background: #fafbfc;
        }

        /* Venus Sidebar */
        .venus-sidebar {
            width: 240px;
            background: var(--venus-bg-card);
            border-right: 1px solid var(--venus-border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .venus-sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--venus-border);
        }

        .venus-logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .venus-logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--venus-text-primary);
            letter-spacing: 0.5px;
        }

        .venus-sidebar-menu {
            flex: 1;
            padding: 8px 0;
            overflow-y: auto;
        }

        .venus-menu-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            margin: 2px 8px;
            border-radius: 6px;
            color: var(--venus-text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--venus-transition);
            cursor: pointer;
        }

        .venus-menu-item:hover {
            background: var(--venus-bg-gray);
            color: var(--venus-text-primary);
        }

        .venus-menu-item.venus-active {
            background: var(--venus-primary);
            color: var(--venus-text-white);
        }

        .venus-sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--venus-border);
        }

        .venus-user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px;
        }

        .venus-user-avatar {
            width: 32px;
            height: 32px;
            background: var(--venus-gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--venus-text-white);
            font-weight: 600;
            font-size: 14px;
        }

        .venus-user-info {
            flex: 1;
            min-width: 0;
        }

        .venus-user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--venus-text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .venus-user-role {
            font-size: 11px;
            color: var(--venus-text-muted);
        }

        .venus-logout-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid var(--venus-border);
            border-radius: 6px;
            color: var(--venus-text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--venus-transition);
        }

        .venus-logout-btn:hover {
            background: var(--venus-danger-light);
            border-color: var(--venus-danger);
            color: var(--venus-danger);
        }

        /* Main Content */
        .venus-main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .venus-page-header {
            padding: 24px 32px;
            background: white;
            border-bottom: 1px solid var(--venus-border);
        }

        .venus-page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--venus-text-primary);
            margin: 0;
        }

        .venus-content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        /* Hubs Content */
        .hubs-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .hubs-header {
            margin-bottom: 32px;
        }

        .hubs-subtitle {
            font-size: 16px;
            color: var(--venus-text-secondary);
            margin-top: 8px;
        }

        .hubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .hub-widget {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .hub-widget::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8b5cf6, #7c3aed);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .hub-widget:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            border-color: #8b5cf6;
        }

        .hub-widget:hover::before {
            transform: scaleX(1);
        }

        .hub-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .hub-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--venus-text-primary);
            margin: 0 0 12px 0;
        }

        .hub-description {
            font-size: 14px;
            color: var(--venus-text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .hub-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--venus-border);
        }

        .hub-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .hub-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hub-status.online {
            color: #10b981;
        }

        .hub-status.coming-soon {
            color: #6b7280;
        }

        .hub-status.coming-soon .hub-status-dot {
            background: #6b7280;
            animation: none;
        }

        .hub-arrow {
            font-size: 20px;
            color: var(--venus-text-muted);
            transition: all 0.3s ease;
        }

        .hub-widget:hover .hub-arrow {
            transform: translateX(4px);
            color: #8b5cf6;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--venus-text-primary);
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 16px;
            color: var(--venus-text-secondary);
        }

        @media (max-width: 768px) {
            .hubs-grid {
                grid-template-columns: 1fr;
            }
            
            .venus-content-area {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="venus-dashboard-layout">
        <!-- Sidebar -->
        <aside class="venus-sidebar">
            <div class="venus-sidebar-header">
                <div class="venus-logo">
                    <span class="venus-logo-text">SHAPPA</span>
                </div>
            </div>
            
            <nav class="venus-sidebar-menu">
                <a href="dashboard.html" class="venus-menu-item">
                    Dashboard
                </a>
                <a href="obiettivi.html" class="venus-menu-item">
                    Obiettivi
                </a>
                <a href="impegni.html" class="venus-menu-item venus-active">
                    Hubs
                </a>
                <a href="calendario.html" class="venus-menu-item">
                    Calendario
                </a>
                <a href="products.html" class="venus-menu-item">
                    Cerca Prodotti
                </a>
                <a href="interessi.html" class="venus-menu-item">
                    I Miei Interessi
                </a>
                <a href="sport.html" class="venus-menu-item">
                    Sport
                </a>
                <a href="dieta.html" class="venus-menu-item">
                    Cookin Shapp
                </a>
                <a href="settings.html" class="venus-menu-item">
                    Impostazioni
                </a>
            </nav>
            
            <div class="venus-sidebar-footer">
                <div class="venus-user-profile">
                    <div class="venus-user-avatar" id="userAvatar">U</div>
                    <div class="venus-user-info">
                        <div class="venus-user-name" id="userName">Utente</div>
                        <div class="venus-user-role">Member</div>
                    </div>
                </div>
                <button class="venus-logout-btn" id="logoutBtn">
                    Log Out
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="venus-main-content">
            <div class="venus-page-header">
                <h1 class="venus-page-title">🎮 Hubs</h1>
            </div>

            <div class="venus-content-area">
                <div class="hubs-container">
                    <div class="hubs-header">
                        <p class="hubs-subtitle">Accedi ai tuoi hub preferiti e scopri nuove esperienze</p>
                    </div>

                    <div class="hubs-grid" id="hubsGrid">
                        <!-- Hubs will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../utils/auth-v2.js"></script>
    <script>
        // Available hubs
        const hubs = [
            {
                id: 'gaming-hub',
                title: 'Gaming Hub',
                description: 'Piattaforma gaming completa con giochi, livelli, esperienza e classifiche. Diventa il campione!',
                icon: '🎮',
                status: 'online',
                path: 'gaming-hub-login.html',
                color: '#8b5cf6'
            },
            {
                id: 'arbitrage-hub',
                title: 'Arbitrage Hub',
                description: 'Sistema professionale per arbitraggio Amazon. Trova prodotti profittevoli, gestisci fornitori e monitora i tuoi listing.',
                icon: '💰',
                status: 'online',
                path: 'arbitrage-hub-login.html',
                color: '#22c55e'
            }
            // Future hubs can be added here
            // {
            //     id: 'music-hub',
            //     title: 'Music Hub',
            //     description: 'Scopri nuova musica, crea playlist e condividi i tuoi brani preferiti.',
            //     icon: '🎵',
            //     status: 'coming-soon',
            //     path: null,
            //     color: '#10b981'
            // }
        ];

        // Auth Check
        document.addEventListener('DOMContentLoaded', () => {
            if (!AuthManager.isLoggedIn()) {
                window.location.href = '/src/pages/login.html';
                return;
            }

            // Load user info
            const user = AuthManager.getCurrentUser();
            if (user) {
                const userName = user.username || user.email || 'Utente';
                document.getElementById('userName').textContent = userName;
                const initial = userName[0].toUpperCase();
                document.getElementById('userAvatar').textContent = initial;
            }

            // Setup logout
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', handleLogout);
            }

            // Load hubs
            loadHubs();
        });

        function handleLogout() {
            if (confirm('Sei sicuro di voler uscire?')) {
                AuthManager.logout();
                window.location.href = '/src/pages/login.html';
            }
        }

        function loadHubs() {
            const container = document.getElementById('hubsGrid');
            
            if (hubs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <div class="empty-title">Nessun hub disponibile</div>
                        <div class="empty-text">Presto saranno disponibili nuovi hub!</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = hubs.map(hub => {
                const statusClass = hub.status === 'online' ? 'online' : 'coming-soon';
                const statusText = hub.status === 'online' ? 'Online' : 'Prossimamente';
                
                return `
                    <div class="hub-widget" onclick="${hub.status === 'online' ? `openHub('${hub.path}')` : 'showComingSoon()'}" style="border-left: 4px solid ${hub.color || '#8b5cf6'};">
                        <span class="hub-icon">${hub.icon}</span>
                        <h2 class="hub-title">${hub.title}</h2>
                        <p class="hub-description">${hub.description}</p>
                        <div class="hub-footer">
                            <div class="hub-status ${statusClass}">
                                <span class="hub-status-dot"></span>
                                ${statusText}
                            </div>
                            <span class="hub-arrow">→</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openHub(path) {
            if (path) {
                window.location.href = path;
            }
        }

        function showComingSoon() {
            alert('🚀 Questo hub sarà disponibile presto!');
        }
    </script>
</body>
</html>

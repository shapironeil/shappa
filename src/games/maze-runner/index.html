<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 92, 246, 0.9);
            padding: 15px 30px;
            border-radius: 10px;
            text-align: center;
        }
        #pc-menu {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }
        #interaction-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(139, 92, 246, 0.9);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="ui">
        <div>🏠 <span style="font-size: 14px;">La Tua Camera</span></div>
    </div>
    
    <div id="instructions">
        <strong>Click per iniziare</strong><br>
        WASD = Movimento | Mouse = Guarda | Spazio = Salta | E = Interagisci
    </div>
    
    <div id="interaction-hint"></div>
    
    <!-- PC Menu -->
    <div id="pc-menu" style="display: none;">
        <div style="background: rgba(17, 24, 39, 0.95); padding: 40px; border-radius: 20px; border: 2px solid #8b5cf6; max-width: 500px;">
            <h2 style="font-size: 32px; margin-bottom: 30px; text-align: center; background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                💻 Menu Gioco
            </h2>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button onclick="startStory()" style="padding: 15px; font-size: 18px; background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%); border: none; border-radius: 10px; color: white; cursor: pointer; font-weight: 600;">
                    📖 Avvia Storia
                </button>
                <button onclick="changeLevel()" style="padding: 15px; font-size: 18px; background: rgba(59, 130, 246, 0.2); border: 2px solid #3b82f6; border-radius: 10px; color: white; cursor: pointer; font-weight: 600;">
                    🎮 Cambia Livello
                </button>
                <button onclick="exitPC()" style="padding: 15px; font-size: 18px; background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; border-radius: 10px; color: white; cursor: pointer; font-weight: 600;">
                    ← Esci
                </button>
            </div>
        </div>
    </div>

    <!-- Three.js Local -->
    <script src="lib/three.min.js"></script>
    <script src="lib/GLTFLoader.js"></script>
    
    <script>
        console.log('🎮 Inizializzazione...');
        
        // Check THREE
        if (typeof THREE === 'undefined') {
            alert('THREE.js non caricato!');
            throw new Error('THREE.js missing');
        }
        
        console.log('✅ THREE.js OK:', THREE.REVISION);
        
        // GLTFLoader
        const gltfLoader = new THREE.GLTFLoader();
        
        // Interactables
        let pcMesh = null;
        let usingPC = false;
        
        // Setup
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8e8e8); // Colore camera più caldo
        scene.fog = new THREE.Fog(0xe8e8e8, 15, 30);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(5, 1.6, 5); // Centro della camera
        
        const renderer = new THREE.WebGLRenderer({ 
            canvas: canvas, 
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.autoUpdate = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        console.log('✅ Renderer configurato con ottimizzazioni');
        
        // Lights - Illuminazione camera (ESSENZIALI - senza queste i GLB appaiono neri)
        // METODO IDENTICO AL COMPONENTE REACT FUNZIONANTE
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        console.log('✅ AmbientLight aggiunta (intensity: 0.8)');
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(-5, 8, 5); // Stessa posizione del componente React
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 10;
        directionalLight.shadow.camera.bottom = -10;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        console.log('✅ DirectionalLight aggiunta (intensity: 1.0)');
        
        const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemisphereLight.position.set(0, 10, 0);
        scene.add(hemisphereLight);
        console.log('✅ HemisphereLight aggiunta (intensity: 0.6)');
        
        // Camera walls - Pareti della camera (10x10 metri)
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f5f5 });
        const wallHeight = 3;
        const roomSize = 10;
        const wallThickness = 0.2;
        
        // Parete Nord (z = 0)
        const northWall = new THREE.Mesh(
            new THREE.BoxGeometry(roomSize, wallHeight, wallThickness),
            wallMaterial
        );
        northWall.position.set(roomSize/2, wallHeight/2, 0);
        northWall.castShadow = true;
        scene.add(northWall);
        
        // Parete Sud (z = 10)
        const southWall = new THREE.Mesh(
            new THREE.BoxGeometry(roomSize, wallHeight, wallThickness),
            wallMaterial
        );
        southWall.position.set(roomSize/2, wallHeight/2, roomSize);
        southWall.castShadow = true;
        scene.add(southWall);
        
        // Parete Est (x = 10)
        const eastWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, wallHeight, roomSize),
            wallMaterial
        );
        eastWall.position.set(roomSize, wallHeight/2, roomSize/2);
        eastWall.castShadow = true;
        scene.add(eastWall);
        
        // Parete Ovest (x = 0)
        const westWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, wallHeight, roomSize),
            wallMaterial
        );
        westWall.position.set(0, wallHeight/2, roomSize/2);
        westWall.castShadow = true;
        scene.add(westWall);
        
        // Floor - Pavimento camera
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(roomSize, roomSize),
            new THREE.MeshStandardMaterial({ 
                color: 0xd4d4d4,
                roughness: 0.9
            })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(roomSize/2, 0, roomSize/2);
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Grid helper per orientamento
        const gridHelper = new THREE.GridHelper(roomSize, 10, 0x888888, 0xaaaaaa);
        gridHelper.position.set(roomSize/2, 0.01, roomSize/2);
        scene.add(gridHelper);
        
        // Keys array (vuoto per ora, non servono nella camera)
        const keys = [];
        
        // Helper function per caricare modelli 3D con normalizzazione automatica
        function loadModel(path, position, rotation, targetSize, options = {}) {
            return new Promise((resolve, reject) => {
                gltfLoader.load(
                    path,
                    (gltf) => {
                        // METODO ESATTO DEL COMPONENTE REACT FUNZIONANTE
                        const model = gltf.scene;
                        const modelName = path.split('/').pop();
                        console.log(`📦 GLB ${modelName} caricato, processando...`);
                        
                        // Bounding box
                        const box = new THREE.Box3().setFromObject(model);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());
                        console.log(`  📐 Bounding box: x=${size.x.toFixed(2)}, y=${size.y.toFixed(2)}, z=${size.z.toFixed(2)}`);
                        console.log(`  📍 Center: x=${center.x.toFixed(2)}, y=${center.y.toFixed(2)}, z=${center.z.toFixed(2)}`);
                        
                        // Scaling (come React funzionante)
                        const maxSize = Math.max(size.x, size.y, size.z);
                        if (maxSize > 0) {
                            const scale = targetSize / maxSize;
                            model.scale.set(scale, scale, scale);
                            console.log(`  🔍 Scaling: ${scale.toFixed(3)}`);
                        }
                        
                        // Posizione (come React funzionante)
                        const boxAfter = new THREE.Box3().setFromObject(model);
                        const centerAfter = boxAfter.getCenter(new THREE.Vector3());
                        model.position.set(position.x, position.y, position.z);
                        model.position.sub(centerAfter);
                        console.log(`  📍 Posizione: x=${model.position.x.toFixed(2)}, y=${model.position.y.toFixed(2)}, z=${model.position.z.toFixed(2)}`);
                        
                        // Rotazione
                        if (rotation) {
                            model.rotation.set(rotation.x || 0, rotation.y || 0, rotation.z || 0);
                        }
                        
                        // Materiali (METODO SEMPLICE COME REACT - FUNZIONA!)
                        model.traverse((child) => {
                            if (child instanceof THREE.Mesh) {
                                child.visible = true;
                                child.castShadow = true;
                                child.receiveShadow = true;
                                
                                if (child.material) {
                                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach((mat) => {
                                        mat.needsUpdate = true;
                                        if (mat instanceof THREE.MeshStandardMaterial) {
                                            mat.transparent = false;
                                            mat.opacity = 1.0;
                                            if (mat.map) mat.map.needsUpdate = true;
                                        }
                                    });
                                }
                            }
                        });
                        
                        // Applica opzioni
                        if (options.interactable) {
                            model.userData.interactable = true;
                            model.userData.type = options.type || 'object';
                        }
                        
                        // Aggiungi alla scena (come React funzionante)
                        model.visible = true;
                        scene.add(model);
                        
                        // Debug finale
                        const finalBox = new THREE.Box3().setFromObject(model);
                        const finalSize = finalBox.getSize(new THREE.Vector3());
                        console.log(`✅ ${modelName} caricato`);
                        console.log(`  📐 Dimensione finale: x=${finalSize.x.toFixed(2)}, y=${finalSize.y.toFixed(2)}, z=${finalSize.z.toFixed(2)}`);
                        console.log(`  📏 Distanza camera: ${camera.position.distanceTo(model.position).toFixed(2)}`);
                        
                        resolve(model);
                    },
                    (progress) => {
                        const modelName = path.split('/').pop();
                        console.log(`📥 Caricamento ${modelName}:`, (progress.loaded / progress.total * 100).toFixed(0) + '%');
                    },
                    (error) => {
                        console.error(`❌ ERRORE caricamento ${path}:`, error);
                        reject(error);
                    }
                );
            });
        }
        
        // Load 3D models for bedroom
        console.log('📦 Caricamento modelli 3D della camera...');
        
        // Tavolino (Desk) - Posizionato davanti al giocatore
        loadModel('/api/models/bench_model_free.glb', new THREE.Vector3(5, 0, 7), { y: 0 }, 1.5, { showHelper: false })
            .catch(() => {
                console.warn('⚠️ Tavolino non caricato, uso placeholder');
                const deskPlaceholder = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 0.7, 0.8),
                    new THREE.MeshStandardMaterial({ color: 0x8b4513 })
                );
                deskPlaceholder.position.set(5, 0.35, 7);
                deskPlaceholder.castShadow = true;
                scene.add(deskPlaceholder);
            });
        
        // Computer (Laptop) - Posizionato sopra il tavolino
        loadModel('/api/models/laptop_free.glb', new THREE.Vector3(5, 0.8, 7), { y: Math.PI }, 0.5, { 
            interactable: true, 
            type: 'pc',
            showHelper: false
        }).then((model) => {
            pcMesh = model;
            // Add glow to PC
            const pcLight = new THREE.PointLight(0x3b82f6, 0.6, 4);
            pcLight.position.set(0, 0.2, 0);
            pcMesh.add(pcLight);
        }).catch(() => {
            console.warn('⚠️ Computer non caricato, uso placeholder');
            pcMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.5, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1e40af, emissiveIntensity: 0.3 })
            );
            pcMesh.position.set(5, 0.8, 7);
            pcMesh.userData.interactable = true;
            pcMesh.userData.type = 'pc';
            scene.add(pcMesh);
        });
        
        // Divano - Posizionato a sinistra del giocatore
        loadModel('/api/models/old_sofa_free.glb', new THREE.Vector3(2, 0, 3), { y: Math.PI / 2 }, 1.2, { showHelper: false });
        
        // Libreria - Posizionata a destra
        loadModel('/api/models/chocolate_beech_bookshelf_free.glb', new THREE.Vector3(8, 0, 5), { y: -Math.PI / 2 }, 1.5, { showHelper: false });
        
        // TV Vintage - Posizionata di fronte al divano
        loadModel('/api/models/vintage_tv_free.glb', new THREE.Vector3(2, 0.5, 6), { y: Math.PI }, 0.8, { showHelper: false });
        
        // Libreria vecchia - Posizionata dietro
        loadModel('/api/models/dusty_old_bookshelf_free.glb', new THREE.Vector3(8, 0, 2), { y: Math.PI / 2 }, 1.5, { showHelper: false });
        
        // Controls
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let isLocked = false;
        let startTime = 0;
        
        let canJump = true;
        let velocityY = 0;
        const gravity = -9.8;
        const jumpForce = 5;
        
        document.addEventListener('keydown', (e) => {
            if (usingPC) return; // Ignora input se stai usando il PC
            
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveRight = true;  // Invertito
            if (e.code === 'KeyD') moveLeft = true;   // Invertito
            if (e.code === 'Space' && canJump && isLocked) {
                e.preventDefault();
                velocityY = jumpForce;
                canJump = false;
            }
            if (e.code === 'KeyE') {
                interactWithNearestObject();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveRight = false;  // Invertito
            if (e.code === 'KeyD') moveLeft = false;   // Invertito
        });
        
        canvas.addEventListener('click', () => {
            if (!isLocked) {
                canvas.requestPointerLock();
            }
        });
        
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === canvas;
            console.log('🔒 Pointer Lock:', isLocked ? 'ATTIVO' : 'DISATTIVATO');
            if (isLocked && startTime === 0) {
                startTime = Date.now();
                document.getElementById('instructions').style.display = 'none';
            } else if (!isLocked) {
                document.getElementById('instructions').style.display = 'block';
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= e.movementX * 0.002;
            euler.x -= e.movementY * 0.002;
            euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
            camera.quaternion.setFromEuler(euler);
        });
        
        // Game loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const speed = 5 * delta;
            
            // Movement
            if (isLocked && !usingPC) {
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();
                
                const right = new THREE.Vector3();
                right.crossVectors(camera.up, forward).normalize();
                
                if (moveForward) camera.position.add(forward.multiplyScalar(speed));
                if (moveBackward) camera.position.add(forward.multiplyScalar(-speed));
                if (moveRight) camera.position.add(right.multiplyScalar(speed));
                if (moveLeft) camera.position.add(right.multiplyScalar(-speed));
                
                // Check if near PC
                checkNearPC();
                
                // Gravity and jump
                velocityY += gravity * delta;
                camera.position.y += velocityY * delta;
                
                // Ground collision
                if (camera.position.y <= 1.6) {
                    camera.position.y = 1.6;
                    velocityY = 0;
                    canJump = true;
                }
                
                // Keep in bounds (dentro la camera)
                camera.position.x = Math.max(0.5, Math.min(9.5, camera.position.x));
                camera.position.z = Math.max(0.5, Math.min(9.5, camera.position.z));
            }
            
            // Animate PC glow (optional)
            if (pcMesh && pcMesh.children.length > 0) {
                const pcLight = pcMesh.children.find(child => child instanceof THREE.PointLight);
                if (pcLight) {
                    pcLight.intensity = 0.6 + Math.sin(Date.now() * 0.001) * 0.1;
                }
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('✅ Gioco pronto! Click per iniziare');
        
        // ========== INTERACTION SYSTEM ==========
        
        function interactWithNearestObject() {
            if (!pcMesh || usingPC) return;
            
            const dist = camera.position.distanceTo(pcMesh.position);
            if (dist < 2.0) {
                usePC();
            }
        }
        
        function checkNearPC() {
            if (!pcMesh || usingPC) {
                document.getElementById('interaction-hint').style.display = 'none';
                return;
            }
            
            const dist = camera.position.distanceTo(pcMesh.position);
            const hint = document.getElementById('interaction-hint');
            
            if (dist < 2.0) {
                hint.textContent = '[E] Usa il PC';
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
            }
        }
        
        function usePC() {
            console.log('💻 Usando PC...');
            usingPC = true;
            
            // Release pointer lock
            if (document.exitPointerLock) {
                document.exitPointerLock();
            }
            
            // Show PC menu
            document.getElementById('pc-menu').style.display = 'flex';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('interaction-hint').style.display = 'none';
        }
        
        function exitPC() {
            console.log('← Uscita dal PC');
            usingPC = false;
            
            // Hide PC menu
            document.getElementById('pc-menu').style.display = 'none';
            document.getElementById('instructions').style.display = 'block';
        }
        
        function startStory() {
            alert('🎮 Avvio Storia... (da implementare)');
            exitPC();
        }
        
        function changeLevel() {
            const level = prompt('Scegli livello (1-10):', '1');
            if (level) {
                alert('Livello ' + level + ' selezionato!');
            }
            exitPC();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightinSimulation - GameHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg">
    <link rel="stylesheet" href="styles/game.css">
</head>
<body>
    <div id="game-container">
        <!-- Menu principale -->
        <div id="main-menu" class="menu-screen">
            <div class="menu-content">
                <h1 class="game-title">FightinSimulation</h1>
                <p class="game-subtitle">Scegli la modalità di gioco</p>
                
                <div class="menu-buttons">
                    <button class="menu-btn" onclick="startGame('story')">
                        <span class="btn-icon">📖</span>
                        <span class="btn-text">Modalità Storia</span>
                        <span class="btn-desc">Vivi l'avventura completa</span>
                    </button>
                    
                    <button class="menu-btn" onclick="startGame('simulation')">
                        <span class="btn-icon">🎯</span>
                        <span class="btn-text">Modalità Simulation</span>
                        <span class="btn-desc">Combattimento libero e training</span>
                    </button>
                    
                    <button class="menu-btn secondary" onclick="goBack()">
                        <span class="btn-icon">←</span>
                        <span class="btn-text">Torna alla Dashboard</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Scelta Genere (Storia) -->
        <div id="gender-selection" class="menu-screen hidden">
            <div class="menu-content">
                <h1 class="game-title">Scegli il tuo Personaggio</h1>
                <p class="game-subtitle">Maschio o Femmina?</p>
                
                <div class="gender-buttons">
                    <button class="gender-btn" onclick="selectGender('male')">
                        <span class="gender-icon">👨</span>
                        <span class="gender-text">Maschio</span>
                    </button>
                    <button class="gender-btn" onclick="selectGender('female')">
                        <span class="gender-icon">👩</span>
                        <span class="gender-text">Femmina</span>
                    </button>
                </div>
                
                <button class="menu-btn secondary" onclick="backToMainMenu()" style="margin-top: 32px;">
                    <span class="btn-icon">←</span>
                    <span class="btn-text">Indietro</span>
                </button>
            </div>
        </div>

        <!-- Selezione Equipaggiamento -->
        <div id="equipment-selection" class="menu-screen hidden">
            <div class="menu-content">
                <h1 class="game-title">Equipaggiamento</h1>
                <p class="game-subtitle" id="equipment-subtitle">Scegli il tuo equipaggiamento</p>
                
                <div class="equipment-grid" id="equipment-grid">
                    <!-- Popolato dinamicamente -->
                </div>
                
                <button class="menu-btn secondary" onclick="backToGenderSelection()" style="margin-top: 32px;">
                    <span class="btn-icon">←</span>
                    <span class="btn-text">Indietro</span>
                </button>
            </div>
        </div>

        <!-- Selezione Nemico (Path Selection) -->
        <div id="path-selection" class="menu-screen hidden">
            <div class="menu-content">
                <h1 class="game-title">Scegli il tuo Avversario</h1>
                <p class="game-subtitle">Stage <span id="current-stage">1</span> - Scegli un percorso</p>
                
                <div class="path-container" id="path-container">
                    <!-- Popolato dinamicamente -->
                </div>
            </div>
        </div>

        <!-- Combattimento -->
        <div id="combat-screen" class="menu-screen hidden">
            <div class="combat-content">
                <div class="combat-header">
                    <div class="combatant-info">
                        <div class="combatant-name" id="player-name">Player</div>
                        <div class="health-bar-combat">
                            <div class="bar-fill" id="player-health-bar" style="width: 100%;"></div>
                            <span class="health-text" id="player-health-text">100/100</span>
                        </div>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="combatant-info">
                        <div class="combatant-name" id="enemy-name">Enemy</div>
                        <div class="health-bar-combat">
                            <div class="bar-fill enemy" id="enemy-health-bar" style="width: 100%;"></div>
                            <span class="health-text" id="enemy-health-text">100/100</span>
                        </div>
                    </div>
                </div>
                
                <div class="combat-actions" id="combat-actions">
                    <!-- Popolato dinamicamente -->
                </div>
                
                <div class="combat-log" id="combat-log">
                    <!-- Log combattimento -->
                </div>
            </div>
        </div>

        <!-- Canvas del gioco (per visualizzazione 3D) -->
        <div id="game-canvas-container" class="hidden">
            <canvas id="game-canvas"></canvas>
            <div id="viewer-controls">
                <button class="viewer-btn" onclick="zoomIn()">+</button>
                <button class="viewer-btn" onclick="zoomOut()">-</button>
                <button class="viewer-btn" onclick="resetView()">↻</button>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
    
    <!-- Game Scripts - Load utilities first -->
    <script src="js/utils/PathSystem.js"></script>
    <script src="js/utils/EvolutionSystem.js"></script>
    <script src="js/utils/Loader.js"></script>
    <script src="js/utils/AudioManager.js"></script>
    <script src="js/GameEngine.js"></script>
    <script src="js/entities/Character.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/combat/CombatSystem.js"></script>
    <script src="js/combat/TurnBasedCombat.js"></script>
    <script src="js/modes/StoryMode.js"></script>
    <script src="js/modes/SimulationMode.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

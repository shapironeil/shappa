name: Deploy to DigitalOcean via SSH

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permette deploy manuale

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          echo "🔍 Validating required secrets..."
          echo ""
          
          MISSING_SECRETS=0
          
          # Check SSH_PRIVATE_KEY
          SSH_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          if [ -z "$SSH_KEY" ] || [ "$SSH_KEY" = "" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY secret is missing!"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            KEY_LENGTH=$(echo "$SSH_KEY" | wc -c)
            echo "✅ SSH_PRIVATE_KEY: configured (length: $KEY_LENGTH chars)"
            if [ "$KEY_LENGTH" -lt 100 ]; then
              echo "   ⚠️  WARNING: Key seems too short. Make sure it includes BEGIN/END lines."
            fi
          fi
          
          # Check DEPLOY_HOST
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          DEPLOY_HOST_LENGTH=${#DEPLOY_HOST}
          if [ -z "$DEPLOY_HOST" ] || [ "$DEPLOY_HOST" = "" ] || [ "$DEPLOY_HOST_LENGTH" -eq 0 ]; then
            echo "❌ ERROR: DEPLOY_HOST secret is missing or empty!"
            echo "   Debug: length=$DEPLOY_HOST_LENGTH"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ DEPLOY_HOST: configured (length: $DEPLOY_HOST_LENGTH chars, value: ${DEPLOY_HOST:0:3}***)"
          fi
          
          # Check DEPLOY_USER
          DEPLOY_USER="${{ secrets.DEPLOY_USER }}"
          DEPLOY_USER_LENGTH=${#DEPLOY_USER}
          if [ -z "$DEPLOY_USER" ] || [ "$DEPLOY_USER" = "" ] || [ "$DEPLOY_USER_LENGTH" -eq 0 ]; then
            echo "❌ ERROR: DEPLOY_USER secret is missing or empty!"
            echo "   Debug: length=$DEPLOY_USER_LENGTH"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ DEPLOY_USER: configured (length: $DEPLOY_USER_LENGTH chars, value: $DEPLOY_USER)"
          fi
          
          # Check DEPLOY_PATH
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "" ]; then
            echo "❌ ERROR: DEPLOY_PATH secret is missing!"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ DEPLOY_PATH: configured (value: $DEPLOY_PATH)"
          fi
          
          echo ""
          if [ "$MISSING_SECRETS" -gt 0 ]; then
            echo "❌ $MISSING_SECRETS secret(s) missing or empty!"
            echo ""
            echo "⚠️  NOTE: If secrets are configured on GitHub but still showing as missing,"
            echo "   they might be empty strings. Please verify the values are not empty."
            echo ""
            echo "Configure or update secrets at:"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "Required secrets:"
            echo "  - SSH_PRIVATE_KEY (your SSH private key)"
            echo "  - DEPLOY_HOST (server IP or hostname)"
            echo "  - DEPLOY_USER (SSH username, e.g., 'deploy' or 'root')"
            echo "  - DEPLOY_PATH (deployment path, e.g., '/var/www/shappa')"
            exit 1
          fi
          
          echo "✅ All secrets are configured correctly!"
          echo ""

      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH..."
          echo "Creating temporary SSH key file..."
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "✅ SSH key file created"
          
          # Test key format
          if grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "✅ SSH key format looks correct"
          else
            echo "❌ ERROR: SSH key format invalid (missing BEGIN/END markers)"
            exit 1
          fi
          
          # Add to ssh-agent
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "✅ SSH key added to agent"
          
          # Test connection
          echo ""
          echo "🔌 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -o LogLevel=ERROR \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "echo 'SSH connection successful' && whoami && pwd" || {
            echo ""
            echo "❌ SSH connection failed!"
            echo ""
            echo "Troubleshooting steps:"
            echo "1. Verify SSH_PRIVATE_KEY is complete (includes BEGIN/END lines)"
            echo "2. Verify DEPLOY_USER exists on server: ${{ secrets.DEPLOY_USER }}"
            echo "3. Verify DEPLOY_HOST is reachable: ${{ secrets.DEPLOY_HOST }}"
            echo "4. Check that public key is in ~/.ssh/authorized_keys on server"
            echo ""
            exit 1
          }
          
          echo "✅ SSH connection successful!"

      - name: Sync files to server
        run: |
          echo "📦 Syncing files to server..."
          echo "Source: $(pwd)"
          echo "Destination: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"
          echo ""
          
          # Verifica permessi directory destinazione
          echo "🔍 Verifying destination directory permissions..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "mkdir -p ${{ secrets.DEPLOY_PATH }} && chmod 755 ${{ secrets.DEPLOY_PATH }} && ls -ld ${{ secrets.DEPLOY_PATH }}" || {
            echo "⚠️ Warning: Could not verify destination directory"
          }
          echo ""
          
          # Sync con opzioni più robuste
          echo "🔄 Starting rsync..."
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.private' \
            --exclude='data/' \
            --exclude='ssl/' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='.cursor/' \
            --exclude='.vscode/' \
            --exclude='*.swp' \
            --exclude='*.swo' \
            --exclude='*~' \
            --no-perms \
            --no-owner \
            --no-group \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --partial \
            --progress \
            --human-readable \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }} 2>&1 | tee /tmp/rsync.log || {
            RSYNC_EXIT=$?
            echo ""
            echo "⚠️ rsync completed with exit code: $RSYNC_EXIT"
            
            # Analizza log per errori critici
            if grep -q "Permission denied" /tmp/rsync.log; then
              echo "❌ Permission denied errors detected!"
              echo "This usually means the deploy user doesn't have write access."
              echo "Fix: Run 'sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} ${{ secrets.DEPLOY_PATH }}' on server"
              exit 1
            elif grep -q "No space left on device" /tmp/rsync.log; then
              echo "❌ No space left on device!"
              exit 1
            elif [ "$RSYNC_EXIT" -eq 23 ]; then
              echo "⚠️ rsync code 23: Some files/attrs were not transferred"
              echo "This is often non-critical (e.g., extended attributes, permissions)"
              echo "Checking if critical files were transferred..."
              
              # Verifica che file critici siano presenti
              ssh -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -i ~/.ssh/deploy_key \
                  ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                  "cd ${{ secrets.DEPLOY_PATH }} && test -f server.js && test -f package.json && echo '✅ Critical files present'" || {
                echo "❌ Critical files missing! Deploy failed."
                exit 1
              }
              
              echo "✅ Critical files are present. Continuing with deploy..."
            else
              echo "❌ rsync failed with exit code: $RSYNC_EXIT"
              echo "Last 20 lines of rsync output:"
              tail -20 /tmp/rsync.log
              exit 1
            fi
          }
          
          echo ""
          echo "✅ Files synced successfully!"

      - name: Remote post-deploy
        run: |
          echo "🚀 Running post-deploy tasks..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
            set -e  # Exit on error
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "📂 Current directory: $(pwd)"
            echo "👤 User: $(whoami)"
            echo ""
            
            # Installa dipendenze
            if [ -f package.json ]; then
              echo "📦 Installing dependencies..."
              npm ci --production || {
                echo "⚠️ npm ci failed, trying npm install..."
                npm install --production
              }
            else
              echo "⚠️ package.json not found, skipping dependency installation"
            fi
            
            # Esegui restart script se esiste
            if [ -f restart.sh ]; then
              echo "🔄 Running restart script..."
              chmod +x restart.sh
              ./restart.sh
            else
              # Fallback: restart con PM2
              # Prova prima senza sudo, poi con sudo se necessario
              if command -v pm2 &> /dev/null || command -v sudo &> /dev/null; then
                echo "🚀 Restarting with PM2..."
                
                # Prova senza sudo
                if command -v pm2 &> /dev/null; then
                  PM2_CMD="pm2"
                elif sudo -n pm2 &> /dev/null 2>&1; then
                  PM2_CMD="sudo pm2"
                else
                  PM2_CMD="pm2"
                fi
                
                # Restart o start
                $PM2_CMD restart shappa 2>/dev/null || \
                $PM2_CMD start server.js --name shappa 2>/dev/null || {
                  echo "⚠️ PM2 restart failed, trying to start fresh..."
                  $PM2_CMD delete shappa 2>/dev/null || true
                  $PM2_CMD start server.js --name shappa || {
                    echo "⚠️ Trying with sudo..."
                    sudo pm2 delete shappa 2>/dev/null || true
                    sudo pm2 start server.js --name shappa
                  }
                }
                
                # Salva configurazione PM2
                $PM2_CMD save 2>/dev/null || sudo pm2 save 2>/dev/null || true
                echo "✅ PM2 process restarted"
              else
                echo "⚠️ PM2 not found. Please restart manually."
                echo "   You can restart manually with: pm2 restart shappa"
              fi
            fi
            
            echo ""
            echo "✅ Deploy completed!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
            cd ${{ secrets.DEPLOY_PATH }}
            echo "📂 Directory: $(pwd)"
            echo "📦 Files: $(ls -la | head -5)"
            echo ""
            
            # Verifica PM2 status
            if command -v pm2 &> /dev/null; then
              echo "📊 PM2 Status:"
              pm2 status || sudo pm2 status || echo "PM2 status check failed"
              echo ""
              echo "📋 PM2 Logs (last 10 lines):"
              pm2 logs shappa --lines 10 --nostream 2>/dev/null || \
              sudo pm2 logs shappa --lines 10 --nostream 2>/dev/null || \
              echo "No logs available"
            else
              echo "⚠️ PM2 not found in PATH"
              if command -v sudo &> /dev/null; then
                echo "   Trying with sudo..."
                sudo pm2 status || echo "PM2 not accessible even with sudo"
              fi
            fi
            
            echo ""
            echo "✅ Verification complete"
          ENDSSH

# Secrets required in GitHub repository:
# SSH_PRIVATE_KEY - Private SSH key for deploy user (no passphrase recommended)
# DEPLOY_HOST - Server IP or hostname (e.g., 164.90.x.x or shapiro.ninja)
# DEPLOY_USER - SSH username (e.g., deploy or root)
# DEPLOY_PATH - Target directory on server (e.g., /var/www/shappa)

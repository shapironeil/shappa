name: Deploy to DigitalOcean via SSH

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permette deploy manuale

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          echo "🔍 Validating required secrets..."
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "❌ ERROR: DEPLOY_HOST secret is missing!"
            echo "   Configure it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "❌ ERROR: DEPLOY_USER secret is missing!"
            echo "   Configure it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "❌ ERROR: DEPLOY_PATH secret is missing!"
            echo "   Configure it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ All secrets are configured"
          echo "   Host: ${{ secrets.DEPLOY_HOST }}"
          echo "   User: ${{ secrets.DEPLOY_USER }}"
          echo "   Path: ${{ secrets.DEPLOY_PATH }}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        continue-on-error: false

      - name: Test SSH connection
        run: |
          echo "🔌 Testing SSH connection to ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH connection successful'"

      - name: Sync files to server
        run: |
          echo "📦 Syncing files to server..."
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='data/' \
            --exclude='ssl/' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
        env:
          RSYNC_RSH: 'ssh -o StrictHostKeyChecking=no'

      - name: Remote post-deploy
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "🚀 Running post-deploy tasks..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
            cd $DEPLOY_PATH
            
            # Installa dipendenze
            if [ -f package.json ]; then
              echo "📦 Installing dependencies..."
              npm ci --production
            fi
            
            # Esegui restart script se esiste
            if [ -f restart.sh ]; then
              echo "🔄 Running restart script..."
              chmod +x restart.sh
              ./restart.sh
            else
              # Fallback: restart con PM2
              if command -v pm2 &> /dev/null; then
                echo "🚀 Restarting with PM2..."
                pm2 restart shappa || pm2 start server.js --name shappa
                pm2 save
              else
                echo "⚠️ PM2 not found. Please restart manually."
              fi
            fi
            
            echo "✅ Deploy completed!"
          ENDSSH

      - name: Verify deployment
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
            cd $DEPLOY_PATH
            if command -v pm2 &> /dev/null; then
              pm2 status
            fi
            echo "✅ Verification complete"
          ENDSSH

# Secrets required in GitHub repository:
# SSH_PRIVATE_KEY - Private SSH key for deploy user (no passphrase recommended)
# DEPLOY_HOST - Server IP or hostname (e.g., 164.90.x.x or shapiro.ninja)
# DEPLOY_USER - SSH username (e.g., deploy or root)
# DEPLOY_PATH - Target directory on server (e.g., /var/www/shappa)

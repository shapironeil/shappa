name: Deploy to DigitalOcean via SSH

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permette deploy manuale

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          echo "🔍 Validating required secrets..."
          echo ""
          
          MISSING_SECRETS=0
          
          # Check SSH_PRIVATE_KEY
          SSH_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          if [ -z "$SSH_KEY" ] || [ "$SSH_KEY" = "" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY secret is missing!"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            KEY_LENGTH=$(echo "$SSH_KEY" | wc -c)
            echo "✅ SSH_PRIVATE_KEY: configured (length: $KEY_LENGTH chars)"
            if [ "$KEY_LENGTH" -lt 100 ]; then
              echo "   ⚠️  WARNING: Key seems too short. Make sure it includes BEGIN/END lines."
            fi
          fi
          
          # Check DEPLOY_HOST
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          if [ -z "$DEPLOY_HOST" ] || [ "$DEPLOY_HOST" = "" ]; then
            echo "❌ ERROR: DEPLOY_HOST secret is missing!"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ DEPLOY_HOST: configured (value: ${DEPLOY_HOST:0:3}***)"
          fi
          
          # Check DEPLOY_USER
          DEPLOY_USER="${{ secrets.DEPLOY_USER }}"
          if [ -z "$DEPLOY_USER" ] || [ "$DEPLOY_USER" = "" ]; then
            echo "❌ ERROR: DEPLOY_USER secret is missing!"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ DEPLOY_USER: configured (value: $DEPLOY_USER)"
          fi
          
          # Check DEPLOY_PATH
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "" ]; then
            echo "❌ ERROR: DEPLOY_PATH secret is missing!"
            MISSING_SECRETS=$((MISSING_SECRETS + 1))
          else
            echo "✅ DEPLOY_PATH: configured (value: $DEPLOY_PATH)"
          fi
          
          echo ""
          if [ "$MISSING_SECRETS" -gt 0 ]; then
            echo "❌ $MISSING_SECRETS secret(s) missing or empty!"
            echo ""
            echo "⚠️  NOTE: If secrets are configured on GitHub but still showing as missing,"
            echo "   they might be empty strings. Please verify the values are not empty."
            echo ""
            echo "Configure or update secrets at:"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "Required secrets:"
            echo "  - SSH_PRIVATE_KEY (your SSH private key)"
            echo "  - DEPLOY_HOST (server IP or hostname)"
            echo "  - DEPLOY_USER (SSH username, e.g., 'deploy' or 'root')"
            echo "  - DEPLOY_PATH (deployment path, e.g., '/var/www/shappa')"
            exit 1
          fi
          
          echo "✅ All secrets are configured correctly!"
          echo ""

      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH..."
          echo "Creating temporary SSH key file..."
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "✅ SSH key file created"
          
          # Test key format
          if grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "✅ SSH key format looks correct"
          else
            echo "❌ ERROR: SSH key format invalid (missing BEGIN/END markers)"
            exit 1
          fi
          
          # Add to ssh-agent
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          echo "✅ SSH key added to agent"
          
          # Test connection
          echo ""
          echo "🔌 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -o LogLevel=ERROR \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "echo 'SSH connection successful' && whoami && pwd" || {
            echo ""
            echo "❌ SSH connection failed!"
            echo ""
            echo "Troubleshooting steps:"
            echo "1. Verify SSH_PRIVATE_KEY is complete (includes BEGIN/END lines)"
            echo "2. Verify DEPLOY_USER exists on server: ${{ secrets.DEPLOY_USER }}"
            echo "3. Verify DEPLOY_HOST is reachable: ${{ secrets.DEPLOY_HOST }}"
            echo "4. Check that public key is in ~/.ssh/authorized_keys on server"
            echo ""
            exit 1
          }
          
          echo "✅ SSH connection successful!"

      - name: Sync files to server
        run: |
          echo "📦 Syncing files to server..."
          echo "Source: $(pwd)"
          echo "Destination: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"
          echo ""
          
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.private' \
            --exclude='data/' \
            --exclude='ssl/' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }} || {
            echo ""
            echo "❌ File sync failed!"
            exit 1
          }
          
          echo ""
          echo "✅ Files synced successfully!"

      - name: Remote post-deploy
        run: |
          echo "🚀 Running post-deploy tasks..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
            set -e  # Exit on error
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "📂 Current directory: $(pwd)"
            echo "👤 User: $(whoami)"
            echo ""
            
            # Installa dipendenze
            if [ -f package.json ]; then
              echo "📦 Installing dependencies..."
              npm ci --production || {
                echo "⚠️ npm ci failed, trying npm install..."
                npm install --production
              }
            else
              echo "⚠️ package.json not found, skipping dependency installation"
            fi
            
            # Esegui restart script se esiste
            if [ -f restart.sh ]; then
              echo "🔄 Running restart script..."
              chmod +x restart.sh
              ./restart.sh
            else
              # Fallback: restart con PM2
              if command -v pm2 &> /dev/null; then
                echo "🚀 Restarting with PM2..."
                pm2 restart shappa || pm2 start server.js --name shappa || {
                  echo "⚠️ PM2 restart failed, trying to start fresh..."
                  pm2 delete shappa 2>/dev/null || true
                  pm2 start server.js --name shappa
                }
                pm2 save
                echo "✅ PM2 process restarted"
              else
                echo "⚠️ PM2 not found. Please restart manually."
              fi
            fi
            
            echo ""
            echo "✅ Deploy completed!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
            cd ${{ secrets.DEPLOY_PATH }}
            echo "📂 Directory: $(pwd)"
            echo "📦 Files: $(ls -la | head -5)"
            echo ""
            
            if command -v pm2 &> /dev/null; then
              echo "📊 PM2 Status:"
              pm2 status
              echo ""
              echo "📋 PM2 Logs (last 10 lines):"
              pm2 logs shappa --lines 10 --nostream || echo "No logs available"
            else
              echo "⚠️ PM2 not found"
            fi
            
            echo ""
            echo "✅ Verification complete"
          ENDSSH

# Secrets required in GitHub repository:
# SSH_PRIVATE_KEY - Private SSH key for deploy user (no passphrase recommended)
# DEPLOY_HOST - Server IP or hostname (e.g., 164.90.x.x or shapiro.ninja)
# DEPLOY_USER - SSH username (e.g., deploy or root)
# DEPLOY_PATH - Target directory on server (e.g., /var/www/shappa)

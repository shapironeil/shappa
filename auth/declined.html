<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Declined - Shappa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #f44336; font-size: 48px; margin: 0; }
        h2 { color: #333; margin: 20px 0; }
        p { color: #666; line-height: 1.6; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️</h1>
        <h2>Autorizzazione Rifiutata</h2>
        <p>Hai scelto di non autorizzare Shappa ad accedere al tuo account eBay.</p>
        <p>Puoi riprovare in qualsiasi momento dalle impostazioni dell'app.</p>
        <button onclick="window.close()">Chiudi</button>
        <button onclick="window.opener.location.reload(); window.close()">Torna alle Impostazioni</button>
    </div>
    <script>
        // Informa la finestra padre
        if (window.opener) {
            window.opener.postMessage({
                type: 'ebay-oauth-result',
                success: false,
                error: 'user_declined',
                errorDescription: 'User declined authorization'
            }, window.location.origin);
        }
    </script>
</body>
</html>
